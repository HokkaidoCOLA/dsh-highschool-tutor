<p class="sub">抛体运动 · 力学场景 · 15 个对象 · 6 个步骤 · 2 个重点步骤</p>
<p class="q">小球以 v₀ = 5 m/s 从 h = 20 m 高处水平抛出，求飞行时间、水平射程、落地速度；若 v₀ 加倍会怎样？</p>
