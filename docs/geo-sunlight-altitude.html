<span class="tag" style="background:#6b8f2f">地理</span>
</div>
<p class="sub">地球的运动 · 地球光照 · 6 个对象 · 6 个步骤 · 2 个重点步骤</p>
<p class="q">读太阳光照图：判断节气与极昼范围，计算北京（40°N）与悉尼（34°S）的正午太阳高度。</p>

    scene: {"v":1,"kind":"globe3d","title":"太阳光照图：极昼极夜与正午太阳高度","subject":"geography","topic":"地球的运动","caption":"同一张图只换直射点纬度 δ，就能读出三个节气（可拖动旋转地球）","view":{"yaw":-30,"pitch":16},"objects":[{"id":"earth","type":"globe","label":"冬至日（12 月 22 日前后）","declination":-23.5},{"id":"rays","type":"sunray","label":"太阳光","n":5},{"id":"spolar","type":"arc","label":"南极圈内：极昼","hidden":true,"from":-180,"to":180,"lat":-72},{"id":"npolar","type":"arc","label":"北极圈内：极夜","hidden":true,"from":-180,"to":180,"lat":72},{"id":"bj","type":"point","label":"北京 40°N","hidden":true,"value":1,"lat":40,"lon":0},{"id":"syd","type":"point","label":"悉尼 34°S","hidden":true,"value":1,"lat":-34,"lon":0}],"steps":[{"title":"第一步：先定直射点纬度","detail":"冬至日太阳直射南回归线，即 δ = 23.5°S。图上那个黄点就是直射点，它所在的经线此刻是正午 12 点。所有计算都从这个 δ 开始。","formula":"δ = 23°26′S ≈ −23.5°（南纬记作负）","key":false,"focus":["earth"]},{"title":"第二步：读晨昏线——谁极昼谁极夜","detail":"黄色大圆是晨昏线，把地球分成昼半球（亮）与夜半球（暗）。记住：极昼出现在直射点所在的那个半球。现在直射南半球，所以南极圈内全天见太阳（极昼），北极圈内全天不见太阳（极夜）——很多人习惯性写成北极极昼，这里一看图就不会错。","formula":"极昼范围：南纬 66.5° ~ 90°　极夜范围：北纬 66.5° ~ 90°","key":false,"show":["spolar","npolar"],"focus":["spolar","npolar"]},{"title":"第三步：用纬度差算正午太阳高度","detail":"公式只有一条：正午太阳高度 = 90° 减去「当地纬度与直射点纬度之差」。北京 40°N 与直射点 23.5°S 一南一北，纬度差要相加：40 + 23.5 = 63.5°。这是整道题最容易错的地方——把南纬记作负值代进绝对值就不会错。图上的数字是引擎按这个公式自己算出来的。","formula":"H = 90° − |φ − δ| = 90° − |40° − (−23.5°)| = 26.5°","key":true,"show":["bj"],"focus":["bj"]},{"title":"第四步：同一天的悉尼为何很高","detail":"悉尼 34°S 与直射点同在南半球，纬度差相减，只有 34 − 23.5 = 10.5°，所以正午太阳高度高达 79.5°。对照北京的 26.5°，规律很清楚：离直射点越近，正午太阳越高。","formula":"H = 90° − |(−34°) − (−23.5°)| = 90° − 10.5° = 79.5°","key":false,"show":["syd"],"focus":["syd","bj"]},{"title":"第五步：只换 δ，整张图翻过来","detail":"现在只把 δ 从 −23.5° 改成 +23.5°，其余一个字没动：整张光照图翻了过来——极昼跑到北极圈，北京的正午太阳高度变成 73.5°，而悉尼降到 32.5°。图上的数字是自动重算的，公式本身一个字都没改。","formula":"北京：90° − |40° − 23.5°| = 73.5°　悉尼：90° − |(−34°) − 23.5°| = 32.5°","key":true,"hide":["spolar","npolar"],"focus":["bj","syd"],"set":{"earth":{"declination":23.5,"label":"夏至日（6 月 22 日前后）"}}},{"title":"第六步：二分日作为第三个坐标","detail":"再把 δ 改为 0°：直射赤道，晨昏线正好过南北极点，全球昼夜等长，北京 H = 50°。三个日期一对比就彻底清楚了：正午太阳高度只取决于「当地纬度与直射点纬度的差」。北京一年的三个关键值：26.5° → 50° → 73.5°。","formula":"二分日 δ = 0°：北京 H = 90° − 40° = 50°，全球昼夜平分","key":false,"focus":["earth","bj"],"set":{"earth":{"declination":0,"label":"春分 / 秋分（3 月 21 日 · 9 月 23 日前后）"}}}]}
